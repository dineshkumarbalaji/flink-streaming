{{- if .Values.flink.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flink-streaming.fullname" . }}-jobmanager
  labels:
    {{- include "flink-streaming.labels" . | nindent 4 }}
    app.kubernetes.io/component: jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "flink-streaming.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jobmanager
  template:
    metadata:
      labels:
        {{- include "flink-streaming.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jobmanager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: jobmanager
        image: "{{ .Values.flink.image }}"
        imagePullPolicy: IfNotPresent
        command: ["jobmanager"]
        ports:
        - name: rpc
          containerPort: 6123
        - name: ui
          containerPort: 8081
        env:
        - name: FLINK_PROPERTIES
          value: |
            jobmanager.rpc.address: flink-jobmanager
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        resources:
          {{- toYaml .Values.flink.jobmanager.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  labels:
    {{- include "flink-streaming.labels" . | nindent 4 }}
    app.kubernetes.io/component: jobmanager
spec:
  type: ClusterIP
  ports:
  - port: 6123
    targetPort: 6123
    name: rpc
  - port: 8081
    targetPort: 8081
    name: ui
  selector:
    {{- include "flink-streaming.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jobmanager
{{- end }}
