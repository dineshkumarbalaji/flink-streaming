{{- if .Values.zookeeper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flink-streaming.fullname" . }}-zookeeper
  labels:
    {{- include "flink-streaming.labels" . | nindent 4 }}
    app.kubernetes.io/component: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "flink-streaming.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: zookeeper
  template:
    metadata:
      labels:
        {{- include "flink-streaming.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: zookeeper
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: zookeeper
        image: "{{ .Values.zookeeper.image }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: client
          containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        resources:
          {{- toYaml .Values.zookeeper.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  labels:
    {{- include "flink-streaming.labels" . | nindent 4 }}
    app.kubernetes.io/component: zookeeper
spec:
  type: ClusterIP
  ports:
  - port: 2181
    targetPort: 2181
    name: client
  selector:
    {{- include "flink-streaming.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: zookeeper
{{- end }}
