---
# Headless Service for Kafka StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: flink-streaming-kafka-headless
  labels:
    app: flink-streaming-kafka
spec:
  clusterIP: None
  selector:
    app: flink-streaming-kafka
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: external
      port: 9092
      targetPort: 9092

---
# ClusterIP Service for in-cluster access by other pods
apiVersion: v1
kind: Service
metadata:
  name: flink-streaming-kafka
  labels:
    app: flink-streaming-kafka
spec:
  selector:
    app: flink-streaming-kafka
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: external
      port: 9092
      targetPort: 9092

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flink-streaming-kafka
spec:
  serviceName: flink-streaming-kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: flink-streaming-kafka
  template:
    metadata:
      labels:
        app: flink-streaming-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 29092
              name: internal
            - containerPort: 9092
              name: external
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            # Use pod hostname from headless service — fixes "port is deprecated" warning
            # and ensures correct advertised address for Kubernetes networking
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://flink-streaming-kafka-0.flink-streaming-kafka-headless:29092,PLAINTEXT_HOST://flink-streaming-kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          readinessProbe:
            exec:
              command:
                - kafka-topics
                - --bootstrap-server
                - localhost:9092
                - --list
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
